  """The unique slug used to construct the item's URL"""
  slug: String!
}

"""The connection type for ProductItemInterface."""
type ProductItemInterfaceConnection {
  """A list of edges."""
  edges: [ProductItemInterfaceEdge]

  """A list of nodes."""
  nodes: [ProductItemInterface]

  """Information to aid in pagination."""
  pageInfo: PageInfo!
}

"""An edge in a connection."""
type ProductItemInterfaceEdge {
  """A cursor for use in pagination."""
  cursor: String!

  """The item at the end of the edge."""
  node: ProductItemInterface
}

"""A reference to the content record a Product is built around"""
input ProductItemRefInput {
  """The id of the Product's item"""
  id: ID!

  """The type of the Product's item"""
  type: ProductItemType!
}

"""The type of content record a Product can be built around"""
enum ProductItemType {
  """The item is a bundle"""
