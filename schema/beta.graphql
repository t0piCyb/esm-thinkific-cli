  """The product ID"""
  id: ID!

  """The community space this product is linked to, if any"""
  linkedSpace: Space

  """SEO details of the product associated with the community"""
  seo: ProductSeo

  """The additional prices for the Product"""
  additionalPrices(
    """Returns the elements in the list that come after the specified cursor."""
    after: String

    """
    Returns the elements in the list that come before the specified cursor.
    """
    before: String

    """Returns the first _n_ elements from the list."""
    first: Int

    """Returns the last _n_ elements from the list."""
    last: Int
  ): ProductPriceConnection

  """Card Image URL of the product"""
  cardImageUrl: URL

  """The categories the Product belongs to"""
  categories(
    """Returns the elements in the list that come after the specified cursor."""
    after: String

    """
    Returns the elements in the list that come before the specified cursor.
    """
    before: String

    """Returns the first _n_ elements from the list."""
    first: Int

    """Returns the last _n_ elements from the list."""
    last: Int
  ): CategoryConnection

  """The URL address for the checkout page of the Product"""
  checkoutUrl: URL

  """The date when the Product was created"""
  createdAt: DateTime!

  """The description of the Product"""
  description: String

  """A list of user entitlements for this product"""
  entitlements(
    """Returns the elements in the list that come after the specified cursor."""
    after: String

    """
    Returns the elements in the list that come before the specified cursor.
    """
    before: String

    """Possible filters for entitlements"""
    filter: ProductEntitlementFilterInput

    """Returns the first _n_ elements from the list."""
    first: Int

    """Returns the last _n_ elements from the list."""
    last: Int
  ): EntitlementConnection

  """Whether the is hidden or not(visible)"""
  hidden: Boolean!

  """The image of the Product"""
  image: Image

  """The content record this Product is built around"""
  item: ProductItemInterface

  """The id of the Product's item"""
  itemId: ID!

  """The type of the Product's item"""
  itemType: ProductItemType!

  """The URL address for the landing page of the Product"""
  landingPageUrl: URL

  """Whether the product is a lead magnet"""
  leadMagnet: Boolean!

  """The name of the Product"""
  name: String!

  """The position of the Product in the manual sort order"""
  position: Int

  """The primary price for the Product"""
  primaryPrice: ProductPrice!

  """Whether the product is private or not(public)"""
  private: Boolean!

  """The Product Page Funnel for this Product"""
  productPageFunnel: Funnel

  """The productable Id"""
  productableId: ID! @deprecated(reason: "Use `itemId` instead.")

  """The productable type"""
  productableType: ProductType! @deprecated(reason: "Use `itemType` instead.")

  """The date when the Product was published"""
  publishedAt: DateTime

  """The url by which one can be directed to continue the product"""
  resumeUrl: URL

  """
  Public seat availability. Never includes a contact email or other destination.
  """
  seatAvailability: SeatAvailability!

  """The product slug"""
  slug: String

  """The publication status of the Product"""
  status: ProductStatus!

  """The date when the Product was updated"""
  updatedAt: DateTime!
}

"""Look up a Product by exactly one of the provided keys (@oneOf)"""
input ProductByInput {
  """The Product's own id"""
  id: ID

  """A reference to the content record the Product is built around"""
  item: ProductItemRefInput
}

"""
When a subscription product change takes effect. Derived from the price comparison, never chosen by the caller.
"""
enum ProductChangeTiming {
  """
  The target product costs more: the difference is prorated and charged now.
  """
  IMMEDIATE

  """
  The target product costs the same or less: the change belongs at the end of the paid period.
  """
  PERIOD_END
}

"""The connection type for Product."""
type ProductConnection {
  """A list of edges."""
  edges: [ProductEdge]

  """A list of nodes."""
  nodes: [Product]

  """Information to aid in pagination."""
  pageInfo: PageInfo!

  """Total number of user's products"""
  totalCount: Int!
}

"""An edge in a connection."""
type ProductEdge {
  """A cursor for use in pagination."""
  cursor: String!

  """The item at the end of the edge."""
  node: Product
}

"""Filter options for querying entitlements on a product"""
input ProductEntitlementFilterInput {
  """Filter by entitlements created within a range"""
  createdAt: DateTimeRangeInput

  """
  Filter by entitlements expiring within a range. Entitlements that never expire are excluded
  """
  expiryDate: DateTimeRangeInput

  """Filter by the current status of the user's access"""
  status: EntitlementStatus

  """Filter by the user GID"""
  userGid: ID
}

"""Possible fields to filter products"""
input ProductFilter {
  """Search by archived products"""
  archived: Boolean

  """Search by products that can show a given order bump"""
  canShowOrderBump: ID

  """Search by category id"""
  categoryIds: [Int!]

  """
  By default, all products are returned. If filter is applied, only products in
  which the current user is enrolled will be included in the result set."
  """
  enrolledProductsOnly: Boolean

  """
  By default, all products are returned. If filter is applied, products the
  current user is enrolled in will be excluded from the result set.
  """
  excludeEnrolledProducts: Boolean

  """
  By default, all live events are returned. If filter is applied, live events
  that have lapsed will be excluded from the result set.
  """
  excludeExpiredLiveEvents: Boolean

  """
  Scope results to products linked to these groups. If none of the supplied
  groups have linked products, no constraint is applied (all products are returned).
  """
  groupIds: [ID!]

  """
  Search by hidden products. Filter is not available for students and unauthenticated users.
  """
  hidden: Boolean

  """Search by product ids"""
  ids: [ID!]

  """Search by products that support in-app purchases"""
  inAppPurchaseSupported: Boolean

  """
  When true, includes private products in results for authenticated users. Used
  for product discovery in places like the Learner Hub Catalog.
  """
  includePrivateForDiscovery: Boolean

  """
  By default, all non-scorm course prodcuts are returned. If filter is applied,
  prodcuts the current user is enrolled in will be excluded from the result set.
  """
  includeScormCourseProducts: Boolean

  """Search by products that are lead magnets"""
  leadMagnets: Boolean

  """Search by product name."""
  name: String

  """Search by price type of both primary and additional prices"""
  priceType: [ProductPriceType!]

  """Search by primary price type"""
  primaryPrice: [ProductPriceType!]

  """Search by private products. Filter is not available for students."""
  private: Boolean

  """Search by product type"""
  productType: [ProductType!]

  """
  When true, scopes results to products linked to the current user's most
  recently joined group. Falls back to all products if the latest group has no
  linked products or the user belongs to no groups.
  """
  withinUserGroups: Boolean
}

"""
A common interface for the content types that a Product can be built around — such as a Course or Community
"""
interface ProductItemInterface {
  """The image of the item"""
  cardImage: Image!

  """The name of the Item"""
