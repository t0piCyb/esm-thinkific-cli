"""Defines the fields for reactivating a user."""
input ReactivateUserInput {
  """A unique identifier for the client performing the mutation."""
  clientMutationId: String

  """
  When true and the plan is at team seat capacity, remove licensed roles
  (site/course/group admin and custom roles) then reactivate. Non-licensed roles
  are kept. Ignored when capacity is available. Requires site owner/admin or
  assign:user_role on the target; otherwise returns SEAT_CAPACITY without stripping.
  """
  removeLicensedRoles: Boolean = false

  """
  When true and SeatLimits blocks reactivation because enrolled enforced courses
  are at capacity, expire those course enrollments then reactivate. Ignored when
  no at-capacity courses block. Other enrollments are kept. Does not require
  edit:enrollment (intentional) — rides on deactivate:user, unlike
  removeLicensedRoles which needs assign:user_role / site admin. Follow-up: LA-1496.
  """
  unenrollAtCapacityCourses: Boolean = false

  """The GID of the user to reactivate."""
  userGid: ID!
}

"""Returns the reactivated user on success, or validation errors."""
type ReactivateUserPayload {
  """
  Courses at capacity that block reactivation. Present when the mutation fails with COURSE_SEAT_CAPACITY.
  """
  atCapacityCourses: [ReactivationAtCapacityCourse!]

  """A unique identifier for the client performing the mutation."""
  clientMutationId: String

  """
  Courses whose enrollments were expired during this reactivate. Empty when enrollments were kept.
  """
  coursesUnenrolled: [ReactivationAtCapacityCourse!]

  """
  Display names of licensed roles actually removed during this reactivate. Empty
  when roles were kept (including when a seat freed before confirm).
  """
  licensedRolesRemoved: [String!]

  """
  Display names of licensed roles that would be removed to reactivate at
  capacity. Present when the mutation fails with SEAT_CAPACITY.
  """
  licensedRolesToDrop: [String!]

  """The reactivated user"""
  user: User

  """Errors on the input of a mutation"""
  userErrors: [UserError!]
}

"""
A course that is at enforced seat capacity and would block reactivation.
"""
type ReactivationAtCapacityCourse {
  """Numeric id of the course."""
  id: ID!

  """Display name of the course."""
  name: String!
}

"""
Read-only preview for reactivating a user against team seat and course seat capacity.
"""
type ReactivationSeatCapacity {
  """
  True when the school has no free team seats and this user would consume one.
  """
  atCapacity: Boolean!

  """
  Enforced courses at capacity that would block reactivation for this user.
  """
  atCapacityCourses: [ReactivationAtCapacityCourse!]!

  """True when any enrolled enforced course is at capacity for this user."""
  atCourseCapacity: Boolean!

  """
  Whether the current actor may use removeLicensedRoles on this user (site owner/admin or assign:user_role on the target).
  """
  canRemoveLicensedRoles: Boolean!

  """
  Display names of licensed roles that would be removed to reactivate at capacity.
  """
  licensedRolesToDrop: [String!]!

  """
  Configured pooled team seat limit. Null when the plan does not enforce a limit.
  """
  licensesLimit: Int

  """Current licensed team member count (active holders only)."""
  licensesUsed: Int!

  """Numeric id of the user this preview applies to."""
  userId: ID!

  """
  True when SeatLimits is on and reactivation would overshoot a course cap.
  """
  wouldBlockCourseSeats: Boolean!

  """True when reactivating this user would consume a pooled team seat."""
  wouldConsumeLicense: Boolean!
}

