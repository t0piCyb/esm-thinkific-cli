  """The item is a community"""
  COMMUNITY

  """The item is a course"""
  COURSE

  """The item is a digital download"""
  DIGITAL_DOWNLOAD

  """The item is a live event"""
  LIVE_EVENT

  """The item is a Thinker"""
  THINKER
}

"""Possible fields to order products by"""
input ProductOrderBy {
  """Required when field is IN_GROUP_CATALOG"""
  catalogGroupId: ID
  direction: OrderDirection!
  field: ProductOrderField!
}

"""Possible fields to order products"""
enum ProductOrderField {
  """Order products by their earliest category name (alphabetically)"""
  CATEGORY_NAME

  """Order products by created_at"""
  CREATED_AT

  """
  Order products by whether they're in the given group's custom catalog — requires catalogGroupId on ProductOrderBy
  """
  IN_GROUP_CATALOG

  """Order products by name"""
  NAME

  """Order products by position"""
  POSITION

  """Order products by product_type"""
  PRODUCT_TYPE

  """Order products by published_at"""
  PUBLISHED_AT

  """Order products by updated_at"""
  UPDATED_AT
}

"""Pricing information for a Product"""
type ProductPrice {
  """Civil end date for new enrollments when this price uses a fixed date"""
  accessExpiresOn: Date

  """
  The amount for the ProductPrice, expressed in the subunit of the price currency
  """
  amount: Int

  """The currency for the price"""
  currency: String!

  """
  Days until enrollment expires after the countdown start (enrollment or course start, per expiry_starts_on)
  """
  daysUntilExpiry: Int

  """The formatted price for the ProductPrice"""
  displayPrice: String

  """
  When the enrollment expiry countdown starts: enrollment or course_start
  """
  expiryStartsOn: String

  """The unique ProductPrice Id"""
  id: ID!

  """The amount for the ProductPrice"""
  price: Float @deprecated(reason: "Use amount instead")

  """The type associated to this price"""
  priceType: ProductPriceType!
}

"""The connection type for ProductPrice."""
type ProductPriceConnection {
  """A list of edges."""
  edges: [ProductPriceEdge]

  """A list of nodes."""
  nodes: [ProductPrice]

  """Information to aid in pagination."""
  pageInfo: PageInfo!
}

"""
Attributes for creating a product price via the public API. Money fields are
expressed in the subunit of the product currency (e.g. 4999 for $49.99 USD).
"""
input ProductPriceCreateInput {
  """
  Civil end date for every new enrollment. Null clears. Omit to leave stored.
  """
  accessExpiresOn: Date

  """The price amount expressed in the subunit of the product currency"""
  amount: Int

  """
  For subscriptions, the first payment amount expressed in the subunit of the product currency
  """
  customFirstAmount: Int

  """The number of days until the enrollment expires"""
  daysUntilExpiry: Int

  """
  When the enrollment expiry countdown starts: enrollment or course_start
  """
  expiryStartsOn: String

  """
  Used for subscription and monthly (payment-plan) price. Values are day, week, month, and year
  """
  interval: String

  """Number for the interval"""
  intervalCount: Int

  """The name for the price"""
  label: String

  """
  A store-scoped key for idempotent price resolution. On the first call a price
  is created and associated with this key; subsequent calls return the existing
  price instead of creating a duplicate.
  """
  lookupKey: String

  """Number of months for the payment-plan payment type"""
  numberOfPayments: Int

  """
  The text displayed on the Buy Button on the course card and the course landing page
  """
  payButtonText: String

  """Used for subscription price, values are day and month"""
  trialInterval: String

  """Number for the trialInterval"""
  trialIntervalCount: Int

  """The price payment type"""
  type: ProductPriceType
}

"""An edge in a connection."""
type ProductPriceEdge {
  """A cursor for use in pagination."""
  cursor: String!

  """The item at the end of the edge."""
  node: ProductPrice
}

"""
A complete relative access-expiry policy. Days and start are set together.
"""
input ProductPriceExpiryInput {
  """Number of days until access expires. Must be greater than 0"""
  days: Int!

  """When the countdown starts"""
  startsOn: ProductPriceExpiryStartsOn!
}

"""When a relative access expiry countdown starts"""
enum ProductPriceExpiryStartsOn {
  """Countdown starts when the learner starts the course"""
  COURSE_START

  """Countdown starts when the learner enrolls"""
  ENROLLMENT
}

"""Represents a product price input"""
input ProductPriceInput {
  """
  Civil end date for every new enrollment. Null clears. Omit to leave stored.
  """
  accessExpiresOn: Date

  """
  Used for subscription price, custom first payment period of subscription
  """
  customFirstPrice: Float

  """The number of days until the enrollment expires"""
  daysUntilExpiry: Int

  """
  When the enrollment expiry countdown starts: enrollment or course_start
  """
  expiryStartsOn: String

  """
  Used for subscription and monthly (payment-plan) price. Values are day, week, month, and year
  """
  interval: String

  """Number for the interval"""
  intervalCount: Int

  """
  Truthy value determining if product price is a primary or additional price
  """
  isPrimary: Boolean

  """The name for additional prices"""
  label: String

  """Number of months for the payment-plan payment type"""
  numberOfPayments: Int

  """
  The text displayed on the Buy Button on the course card and the course landing page
  """
  payButtonText: String

  """The price value for the price"""
  price: Float

  """Used for subscription price, values are day and month"""
  trialInterval: String

  """Number for the trialInterval"""
  trialIntervalCount: Int

  """The price payment type"""
