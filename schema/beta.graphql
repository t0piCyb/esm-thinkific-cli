"""Query root for the App schema"""
type Query {
  """Find a community by ID"""
  community(
    """Community ID"""
    id: ID!
  ): Community

  """Find a community user by ID"""
  communityUser(
    """Community ID (required when using user_id)"""
    communityId: ID

    """Community user ID"""
    id: ID

    """User ID"""
    userId: ID
  ): CommunityUser

  """Find a post or reply by ID"""
  post(
    """Post or Reply ID"""
    id: ID!
  ): Post

  """Find a space by ID"""
  space(
    """Space ID"""
    id: ID!
  ): Space

  """Find a package by ID"""
  scormPackage(
    """Package ID"""
    id: ID!
  ): Package

  """Find a package by course ID"""
  scormPackageByCourseId(
    """Course ID"""
    courseId: ID!
  ): Package

  """Find a lesson-scoped package by lesson ID"""
  scormPackageByLessonId(
    """Lesson ID"""
    lessonId: ID!
  ): Package

  """
  Active (not removed, not expired) bundle enrollments for a user in the current site. Oldest first.
  """
  activeBundleEnrollments(
    """Returns the elements in the list that come after the specified cursor."""
    after: String

    """
    Returns the elements in the list that come before the specified cursor.
    """
    before: String

    """Returns the first _n_ elements from the list."""
    first: Int

    """Returns the last _n_ elements from the list."""
    last: Int

    """The user whose active bundle enrollments to return."""
    userGid: ID!
  ): ActiveBundleEnrollmentConnection!

  """Submission versions and email audit for one learner on one assignment"""
  assignmentSubmissionHistory(
    """Assignment id"""
    assignmentId: ID!

    """Learner user id"""
    userId: ID!
  ): AssignmentSubmissionHistory!

  """Returns a Bundle by Id"""
  bundle(
    """The unique Id of the Bundle to return"""
    id: ID!
  ): Bundle

  """Returns a Category by Id"""
  category(
    """The unique Id of the Category to return"""
    id: ID!
  ): Category

  """
  What moving a subscription to another product would cost, and when it would
  happen. Available to Plus and Enterprise sites only; any other site gets a
  FORBIDDEN error.
  """
  changeSubscriptionProductPreview(
    """The subscription to move"""
    subscriptionId: ID!

    """The product price to move it to"""
    targetPriceId: ID!
  ): ChangeSubscriptionProductPreview

  """Returns a Chapter by Id"""
  chapter(
    """The unique Id of the Chapter to return"""
    id: ID!
  ): Chapter

  """Returns a Course by Id"""
  course(
    """The unique Id of the Course to return"""
    id: ID!
  ): Course

  """Returns a Course by Slug"""
  courseBySlug(
    """The unique Slug of the Course"""
    slug: String!
  ): Course

  """
  Which of these users have an active subscription or outstanding payment plan that blocks deactivation. Read-only.
  """
  deactivationBillingBlocks(
    """
    The GIDs or numeric ids to check. Malformed or unknown ids are dropped.
    """
    userIds: [ID!]!
  ): [ID!]!

  """Returns a Group by Id"""
  group(
    """The unique Id of the Group to return"""
    id: ID!
  ): Group

  """Returns a Lesson by Id"""
  lesson(
    """The unique Id of the Lesson to return"""
    id: ID!
  ): Lesson

  """Me"""
  me: User

  """
  Single-tier memberships for the current site (bundles with usedForMemberships). Admin-only.
  """
  memberships(
    """Optional filters by id, slug, or tiered-membership linkage."""
    filter: MembershipsFilterInput
  ): [Bundle!]!

  """
  Returns the full permission catalog for building custom roles, organized by
  groups, collections, and individual permissions.
  """
  permissionCatalog(
    """
    When provided, only returns collections available for this default role slug
    """
    forRole: DefaultRoleSlug = null
  ): PermissionCatalog

  """Returns a Product by its id or by a reference to its item"""
  product(
    """
    Look up the Product by exactly one key (its id or a reference to its item)
    """
    by: ProductByInput

    """The unique Id of the Product to return"""
    id: ID @deprecated(reason: "Use `by: { id: ... }` argument instead.")
  ): Product

  """
  A program for the current site by id. Null when not found or when the feature is unavailable.
  """
  program(
    """The unique id of the program."""
    id: ID!
  ): Program

  """
  Programs for the current site, oldest first (paginated). Empty when the feature is unavailable.
  """
  programs(
    """Returns the elements in the list that come after the specified cursor."""
    after: String

    """
    Returns the elements in the list that come before the specified cursor.
    """
    before: String

    """Returns the first _n_ elements from the list."""
    first: Int

    """Returns the last _n_ elements from the list."""
    last: Int
  ): ProgramConnection!

  """
  Which of these users would hit team seat capacity on reactivate, and which licensed roles would be dropped. Read-only.
  """
  reactivationSeatCapacity(
    """
    The GIDs or numeric ids to check. Malformed or unknown ids are dropped.
    """
    userIds: [ID!]!
  ): [ReactivationSeatCapacity!]!

  """Site"""
  site: Site!

  """
  A tiered membership for the current site by id or by slug. Provide exactly one
  of `id` or `slug`. Null when not found or when the feature is unavailable.
  """
  tieredMembership(
    """
    The unique id of the tiered membership. Provide this or `slug`, not both.
    """
    id: ID

    """
    The URL-friendly identifier of the tiered membership within the site. Provide this or `id`, not both.
    """
    slug: String
  ): TieredMembership

  """
  All tiered memberships for the current site, oldest first. Empty when the feature is unavailable.
  """
  tieredMemberships: [TieredMembership!]!

  """Returns a User by Id"""
  user(
    """The global Id of the User to return"""
    gid: ID!
  ): User

  """Returns a User by Email"""
  userByEmail(
    """The email address of the User"""
    email: EmailAddress!
  ): User
}

