"""A user profile"""
type Profile {
  """A User's avatar"""
  avatar: Image
}

"""
A Rails-owned learning structure (Learning Path or Certification eligibility syllabus).
"""
type Program {
  """The unique identifier of the program."""
  id: ID!

  """When the program was created."""
  createdAt: DateTime!

  """
  Path-level availability. When From start, every step is open; when After
  previous, steps that inherit (null override) follow this default.
  """
  defaultAvailability: ProgramAvailability!

  """Optional description."""
  description: String

  """The name of the program."""
  name: String!

  """All requirement groups for the program, lowest position first."""
  requirementGroups: [ProgramRequirementGroup!]!

  """The root group (position 0). Null until created."""
  rootRequirementGroup: ProgramRequirementGroup

  """When the program was last changed."""
  updatedAt: DateTime!
}

"""
When a program step becomes available relative to earlier required steps.
"""
enum ProgramAvailability {
  """Available after earlier required steps are satisfied."""
  AFTER_PREVIOUS

  """Available from the start of the path."""
  FROM_START
}

"""The connection type for Program."""
type ProgramConnection {
  """A list of edges."""
  edges: [ProgramEdge]

  """A list of nodes."""
  nodes: [Program]

  """Information to aid in pagination."""
  pageInfo: PageInfo!
}

"""An edge in a connection."""
type ProgramEdge {
  """A cursor for use in pagination."""
  cursor: String!

  """The item at the end of the edge."""
  node: Program
}

"""A PRODUCT target inside a program requirement group."""
type ProgramRequirement {
  """
  Step availability override. Null inherits the program default. The
  lowest-position leaf always reads as From start for display; storage keeps
  inherit/after_previous so it still gates later steps.
  """
  availability: ProgramAvailability

  """Whether learners must complete this step for path progress and gating."""
  completionRequired: Boolean!

  """When the requirement was created."""
  createdAt: DateTime!

  """The unique identifier of the requirement."""
  id: ID!

  """The requirement kind."""
  kind: ProgramRequirementKind!

  """Order within the parent group, zero-based."""
  position: Int!

  """The product id this requirement targets."""
  productId: ID!

  """When the requirement was last changed."""
  updatedAt: DateTime!
}

"""
A group of program requirements (and optional nested groups) evaluated with ALL, ANY, or N_OF.
"""
type ProgramRequirementGroup {
  """Nested child groups (e.g. alternate OR routes under an ANY parent)."""
  childRequirementGroups: [ProgramRequirementGroup!]!

  """When the group was created."""
  createdAt: DateTime!

  """The unique identifier of the requirement group."""
  id: ID!

  """Required count when rule is N_OF; null otherwise."""
  n: Int

  """Whether members must be completed in position order."""
  ordered: Boolean!

  """
  Parent group id when nested (null for the program root and other top-level groups).
  """
  parentRequirementGroupId: ID

  """Order among sibling groups, zero-based."""
  position: Int!

  """Leaf PRODUCT requirements in this group, lowest position first."""
  requirements: [ProgramRequirement!]!

  """How members combine for satisfaction."""
  rule: ProgramRequirementGroupRule!

  """When the group was last changed."""
  updatedAt: DateTime!
}

"""How child requirements and nested groups combine for satisfaction."""
enum ProgramRequirementGroupRule {
  """Every member must be satisfied."""
  ALL

  """At least one member must be satisfied (OR / alternate routes)."""
  ANY

  """At least n members must be satisfied."""
  N_OF
}

"""Requirement role within a program requirement group."""
enum ProgramRequirementKind {
  """A product the learner completes toward the group."""
  COMPONENT

  """A gate requirement (reserved for future unlock rules)."""
  GATE
}

"""One line of the invoice a subscription product change would raise"""
type ProrationLineItem {
  """Amount in currency subunits; negative for credit"""
  amount: Int!

  """The currency of the line"""
  currency: String!

  """What the line covers"""
  description: String

  """End of the period this line covers"""
  periodEnd: DateTime!

  """Start of the period this line covers"""
  periodStart: DateTime!

  """Whether the line is a proration rather than a full-period charge"""
  proration: Boolean!
}

